# Secret scanning — blocks a PR if a credential is about to reach the repo.
# Cheap insurance for repos that keep local .env files (most of ours).
#
# Scaffolded by the `sdlc` plugin (/sdlc:init).
name: Secret scan

on:
  # No `branches:` filter — see the note in ci.yml. A stacked PR would
  # otherwise skip secret scanning entirely and report clean.
  # `edited` for the same reason as in ci.yml: it is what fires when a PR's
  # base changes, and this scan diffs against the base.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Superseded pushes must not pile up: this clones full history for the diff,
# and the trigger is unfiltered, so without this every push to a stacked
# branch queues another full-history scan with nothing cancelling it.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan the PR's commit range.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private repos require GITLEAKS_LICENSE — without it the scan
          # silently no-ops. Add the secret to enable enforcement.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
