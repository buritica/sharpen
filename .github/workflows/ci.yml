# Lint, test, marketplace consistency, the pi extension smoke test and the
# portable gate check. lint, test and marketplace fan through the shared setup
# workflow; pi and gates set up their own. Every job runs on every event:
# there is no path filter, because a filter that misses one file the checks
# depend on (it once missed package.json, pyproject.toml and schemas/) turns
# into a green ci-pass that validated nothing.
#
# Scaffolded by the `sdlc` plugin (/sdlc:init).
name: CI

on:
  # No `branches:` filter. That key filters on the PR's BASE branch, so
  # `branches: [main]` silently skips CI entirely for a PR stacked on another
  # branch — and GitHub then reports that PR as "clean", because nothing is
  # blocking a merge when no checks exist. Unvalidated reads identical to
  # passing. Running on every base costs a little more runner time and removes
  # a whole class of false green.
  #
  # `edited` is in `types` because it is the activity that fires when a PR's
  # BASE CHANGES. The default set (opened/synchronize/reopened) does not include
  # it, so when a parent PR merges and GitHub auto-retargets a stacked PR to
  # main, no new run fires — and the stacked PR keeps a green earned against a
  # base that no longer exists. `edited` also fires on title/body edits, so
  # this costs some extra runs. That is the deliberate trade: a few wasted minutes against a required
  # check that means "we validated this against a different branch."
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # main itself: a merge result is never what any PR run validated, so check
  # it after it lands. The weekly run catches runner-image and dependency
  # drift on a quiet repo; workflow_dispatch is for re-running by hand.
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # Superseded PR runs are cancelled. Runs on main get a group of their own
  # (the run id): a shared group would keep only one pending run, so a third
  # quick merge would cancel the second's queued run and that merge would
  # never get a result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    uses: ./.github/workflows/setup.yml
    with:
      command: "ruff format --check . && ruff check ."

  # The hooks promise to run on "any box with python3". 3.9 is the floor
  # (macOS's system python3); 3.13 is the newest this repo targets.
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    uses: ./.github/workflows/setup.yml
    with:
      python-version: ${{ matrix.python }}
      command: "python3 scripts/run-tests.py"

  marketplace:
    uses: ./.github/workflows/setup.yml
    with:
      command: "python3 scripts/check-marketplace.py"

  # The pi adapters (plugins/*/extensions/*.ts), loaded against a stub pi API
  # and driven through the real python hooks. Run directly rather than through
  # run-tests.py's wrapper, which skips when Node is missing.
  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pi extension smoke test
        run: >-
          node --experimental-strip-types --no-warnings
          --import ./scripts/tests/pi/register.mjs
          --test scripts/tests/pi/extensions.test.mjs

  # Portable gate enforcement: validates the PR head's gate cycle and review
  # report against the commit being merged. This is the cross-clone authority
  # the local hook cannot be — forked PRs and agents without local hooks are
  # held to the same standard here.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate gate cycle
        run: python3 plugins/sdlc/scripts/ci-validate.py
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          SDLC_GATES_PATH: .sharpen/data/gates.json

  # Aggregator and the one required check: always runs, fails if any job it
  # needs failed, was cancelled, timed out or was skipped. Nothing is
  # path-gated any more, so a skip means something went wrong.
  ci-pass:
    needs: [lint, test, marketplace, pi, gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          summary=$(printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          for job, need in json.load(sys.stdin).items():
              print("%s=%s" % (job, need["result"]))
          ')
          [ -n "$summary" ] || { echo "ERROR: no job results found; is the needs list empty?"; exit 1; }
          echo "$summary"
          failed=$(printf '%s\n' "$summary" | grep -v '=success$' || true)
          if [ -n "$failed" ]; then
            echo "Jobs that did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs passed."
