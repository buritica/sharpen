# Reusable workflow: checkout + Python setup + run command.
# On hosted runners: installs requirements-dev.txt (ruff) via pip with cache.
# On self-hosted runners: deps are expected to be pre-installed; runs git clean.
#
# Scaffolded by the `sdlc` plugin (/sdlc:init).
name: Setup

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string"
        required: false
        default: '"ubuntu-latest"'
        type: string
      python-version:
        description: >-
          Python to run the command under. Empty means the 3.13 that
          actions/setup-python provides. Anything else is installed with uv,
          because setup-python has no builds of older interpreters (3.9) for
          current runner images.
        required: false
        default: ""
        type: string
      command:
        description: "Command to run after setup"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: ${{ !contains(fromJSON(inputs.runs-on), 'self-hosted') }}
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Clean untracked files (self-hosted)
        if: ${{ contains(fromJSON(inputs.runs-on), 'self-hosted') }}
        run: git clean -fd

      - name: Install dev dependencies
        if: ${{ !contains(fromJSON(inputs.runs-on), 'self-hosted') }}
        run: pip install -r requirements-dev.txt

      - name: Put the requested Python first on PATH
        if: ${{ inputs.python-version != '' && !contains(fromJSON(inputs.runs-on), 'self-hosted') }}
        env:
          PYVER: ${{ inputs.python-version }}
        run: |
          set -eu
          pip install "uv==0.11.32"
          uv python install "$PYVER"
          bindir="$(dirname "$(uv python find "$PYVER")")"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/python3" --version

      - name: Run
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -c "$COMMAND"
