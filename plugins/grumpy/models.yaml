# Grumpy model map — single switch point for model routing.
#
# Commands and `exec:` hints reference ROLE names, never raw model strings.
# To bump a model rev, change one column and nothing downstream changes.
#
# A repo can override any entry with its own `.sharpen/models.yaml` (same
# shape; only the keys it sets win). Commands read that file first, then this
# one.
#
# Columns, per host:
#   claude  Anthropic API id (pinned snapshot). Checked against
#           platform.claude.com/docs/en/models/overview on 2026-11-22.
#   native  Claude Code's per-subagent `model` argument. It takes aliases
#           only: sonnet / opus / haiku / fable. `fable` resolves to Fable 5.1
#           unless ANTHROPIC_DEFAULT_FABLE_MODEL is set (claude-fable-5-2 to
#           get 5.2); the others resolve to the 5.5 models.
#   codex   Model to run a Codex session on for this role. Codex has no
#           per-subagent model argument, so a pass runs on the session's
#           model and this column is advice, not dispatch. Ids are from
#           OpenAI's Codex models page on 2026-11-22; which id suits which
#           role is UNVERIFIED until scripts/bench-grumpy.py has measured it.
#   pi      Same idea for pi (`--model provider/id`). null = keep the session
#           model; pi users pick their own provider.

hosts:
  claude-code: {column: native, per_agent_model: true}
  codex: {column: codex, per_agent_model: false, verified: false}
  pi: {column: pi, per_agent_model: false}

roles:
  audit:        # grumpy:audit synthesis + planning (heaviest reasoning)
    claude: claude-fable-5-2
    native: fable
    codex: gpt-6.2-astra
    pi: null
  analysis:     # review / architecture / security / product / edge-cases finding passes
    claude: claude-opus-5-5
    native: opus
    codex: gpt-6.2-astra
    pi: null
  exec:         # default fix execution (M steps)
    claude: claude-sonnet-5-5
    native: sonnet
    codex: gpt-6.2-sol
    pi: null
  exec-trivial: # S mechanical steps (exec: trivial)
    claude: claude-haiku-5-5
    native: haiku
    codex: gpt-6-luna
    pi: null
  escalation:   # gate-failure bump target — one rung up; the ladder tops at `analysis`
    order: [exec-trivial, exec, analysis]

# Routing follows the benchmark (scripts/bench-grumpy.py, Claude Code, Sonnet
# session, 3 repeats per case, 2026-11-22). Review's passes on `analysis` (opus)
# matched or beat the session model. /grumpy:imagine is not routed: on that run
# opus lost recall on one imagine case, and 3 repeats is too small a sample to
# say which model is better at it. Imagine stays on the session's model until a
# larger rerun settles it; revisit then rather than reading this as a verdict.

# Escalation ladder for `--max-tier` clamping (low → high):
#   exec-trivial(haiku) < exec(sonnet) < analysis(opus)
# `audit` sits outside the ladder: it's grumpy:audit's own synthesis model
# (Fable, now natively dispatchable as `fable`), not a rung a failed fix
# escalates to.
